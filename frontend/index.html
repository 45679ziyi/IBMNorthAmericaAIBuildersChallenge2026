<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURORA — Campus Intelligence</title>
    <meta name="description" content="AURORA is an independent educational prototype campus intelligence assistant. Not affiliated with Stony Brook University or IBM." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5F8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D1220" />
    <!-- Flash-free theme: set data-theme before first paint -->
    <script>
(function(){
  try{
    var t=localStorage.getItem('aurora-theme');
    if(t==='dark'||(t==='system'||t==null)&&matchMedia('(prefers-color-scheme:dark)').matches)
      document.documentElement.setAttribute('data-theme','dark');
  }catch(e){}
})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
